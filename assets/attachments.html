<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Attachments · Duck Lab</title>
  <link rel="stylesheet" href="sim/sim.css?v=15">
  <style>
    .gallery{max-width:1050px;margin:auto;padding:1rem;color:var(--text)}
    .gallery header,.gallery nav,.gallery .choices{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
    .gallery header{justify-content:space-between;margin-bottom:.6rem}
    .gallery h1{margin:0;font-size:clamp(1.2rem,3.5vw,1.6rem)}
    .gallery nav{gap:1rem}.gallery a{color:var(--mint)}
    .gallery button[aria-pressed="true"]{color:#0b2825;background:var(--mint);border-color:var(--mint)}
    .gallery figure{margin:.65rem 0}.gallery img{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain;background:#10191d;border-radius:8px}
    .gallery figcaption{line-height:1.5;margin-top:.5rem;max-width:88ch}
    .gallery .links{display:flex;gap:1rem;flex-wrap:wrap;margin:.5rem 0;color:var(--muted)}
  </style>
</head>
<body><main class="gallery">
  <header><h1>Attachment studies</h1><nav aria-label="Duck Lab"><a href="simulate.html?mods=1">Duck Lab Mods</a><a href="tail-sizing.html">Recovery replay</a></nav></header>
  <div class="choices" id="choices" role="group" aria-label="Choose an attachment"></div>
  <label id="replay-controls" hidden>Replay <select id="replay"></select></label>
  <figure><img id="drawing" alt=""><figcaption id="notes" role="status"></figcaption></figure>
  <div class="links" id="links"></div>
</main>
<script type="module">
  const studies = [
  {
    "id": "grove-shoulder",
    "label": "Grove shoulder camera",
    "image": "grove-shoulder.png",
    "alt": "OV5647 camera facing forward on the right shoulder, blue Grove Vision AI V2 board behind it and a mint cable running back to the backpack",
    "note": "The short CSI ribbon links the camera to the Vision AI V2. The four-wire Grove lead clips along the removable boom to the backpack. The printed carrier alone is estimated at 13.89 g. This is a mechanical fit study. Physical fit, electrical integration and loaded get-up trials are pending.",
    "links": [["Carrier STL, wiring notes and bounty brief", "grove-shoulder-kit.zip"]]
  },
  {
    "id": "teeth-guard",
    "label": "Teeth + guard recovery",
    "image": "teeth-guard.webp",
    "alt": "Side-by-side policy replay of the same co-printed jaws with two guard shapes, first from a 95° right-side fall and then through a forward roll launched at 0.34 seconds",
    "note": "Both ducks wear the same co-printed teeth. At 95° on its right, the earlier guard stayed down. With 0.92 mm more flare on each side, the duck resumed walking in 3.58 s and advanced 2.01 m. Both cleared the 0.34 s roll. The revised guard passed 39 of 40 simulated starts, with one miss at 97° on its right.",
    "links": [
      ["Matched trial results", "teeth-guard-results.json"],
      ["Nearby angles and launch times", "teeth-guard-neighbors.json"],
      ["Revised guard STL and fit checks", "teeth-guard-kit.zip"],
      ["Co-printed jaws and fit coupon", "coprint-teeth-kit.zip"]
    ]
  },
  {
    "id": "coprint",
    "label": "Co-printed teeth",
    "image": "coprint-teeth.png",
    "alt": "Embedded TPU teeth and smooth stock jaws side by side, with a section through a keyed tooth root",
    "note": "Four flexible teeth per cheek on each rigid jaw. Each root has its own buried crossbar. For a smooth finish, swap the jaw shells. Start with the one-tooth coupon to check material assignment and retention.",
    "links": [
      [
        "Two-material 3MFs and U1 print guide",
        "coprint-teeth-kit.zip"
      ],
      [
        "Optional magnetic chin parts",
        "magnetic-face-kit.zip"
      ]
    ]
  },
  {
    "id": "guard",
    "label": "Rounded guard trials",
    "image": "guard-recovery.webp",
    "alt": "Matched original and rounded everyday guard runs using the stock get-up policy",
    "note": "The rounded guard stood from its back in 3.18 s and its right side in 3.42 s. Both covers retained the board shield. The original guard stayed down after these two starts. The clock jumps to the 20 s result at the end of each get-up replay.",
    "links": [
      [
        "Print guard and view test data",
        "rounded-guard-kit.zip"
      ],
      [
        "Compare guard shapes",
        "guard-cad.png"
      ]
    ],
    "replays": [
      {
        "id": "recovery",
        "label": "Back and right get-ups",
        "image": "guard-recovery.webp"
      },
      {
        "id": "front-left",
        "label": "Front and left get-ups",
        "image": "guard-front-left.webp",
        "note": "Both guards recovered from the front and left. The rounded guard resumed walking in 3.10 s from the front and 2.56 s from the left."
      },
      {
        "id": "rolls",
        "label": "Four forward-roll launches",
        "image": "guard-roulade.webp",
        "note": "Both guards completed all four forward rolls at the original launch times. The rounded guard missed one of seven additional launch times. These flat-floor runs use the shipped roll and walk policies."
      }
    ]
  },
  {
    "id": "claws",
    "label": "T. rex arms",
    "image": "necklace-claws.webp",
    "alt": "Rotating removable open collar with two bent arms and three curled, rounded claws on each hand",
    "note": "Six rounded TPU claws come away with the open-backed necklace. The print estimate is 4.69 g. With a 167 mm tail, both the smooth and clawed paw models stood up in 3.28 s from their right side.",
    "links": [
      [
        "Print collar and arms",
        "three-claw-necklace.zip"
      ],
      [
        "Paw close-up",
        "necklace-claws.png"
      ],
      [
        "On the Duck",
        "claws-on-duck.png"
      ]
    ]
  },
  {
    "id": "off",
    "label": "Mods removed",
    "image": "magnetic-face.png",
    "alt": "Revised bare head and chin beside their fitted accessories",
    "note": "With the cosmetic pieces off, the brow and chin are smooth. Only the optional cheek screw holes show. The revised head and flush receiver walked 2.59 m and passed all four flat-floor get-ups and four rolls. Adding the everyday guard and cartridges passed the rolls but failed the back and right get-ups in this same test.",
    "links": [
      [
        "Head and jaw kit and simulation results",
        "magnetic-face-kit.zip"
      ],
      [
        "Rear options",
        "rear-configurations.png"
      ]
    ]
  },
  {
    "id": "rear",
    "label": "Rear guard and runners",
    "image": "rear-configurations.png",
    "alt": "Recessed receiver alone, everyday protective cover installed, and removed tail cover with integral runners",
    "note": "The vented everyday cover slides on the removable V1.1 rails. Both roll shoes are built into the alternate tail cover. Release that cover and lift to remove the shoes and attached tail together. Pulling just the hinge pin leaves the runners on. Physical latch effort still needs a fit test.",
    "links": [
      [
        "Rear print files and test data",
        "removable-rear-kit.zip"
      ]
    ]
  },
  {
    "id": "mouth",
    "label": "Mouth tools",
    "image": "mouth-tools.png",
    "alt": "Pointer, paired fork tips and offset horn shown in the V5 beak and on their shared paddle",
    "note": "The stock beak holds one keyed paddle. Fit the single pointer, two tips 23 mm apart, or the offset horn before pickup. The CAD grasp and pickup path cleared the stock jaws and stand. Grip force and key actuation still need measurement.",
    "links": [
      [
        "Print files and assembly notes",
        "mouth-tools-fit.zip"
      ],
      [
        "Predicted camera views",
        "mouth-camera-aim.png"
      ]
    ]
  },
  {
    "id": "pickup",
    "label": "Pickup stand",
    "image": "mouth-pickup-stand.png",
    "alt": "Pickup stand presenting the mouth tool at jaw height, with approach and lift diagram",
    "note": "The ears on the paddle sit in the stand while the jaws close on the handle. The checked path lifts 20 mm before retreating. Release the tool before an empty-mouth stock roll. An autonomous pickup policy has yet to be tested.",
    "links": [
      [
        "Print stand and paddle",
        "mouth-tools-fit.zip"
      ]
    ]
  },
  {
    "id": "fan",
    "label": "Folding shoulder fan",
    "image": "folding-shoulder-feeler.png",
    "alt": "Three folding rounded lobes on the right-side shoulder boom, its removed cartridge and the camera view of its center pad",
    "note": "A removable, hand-opened shoulder fan carries three rounded lobes and a center stylus. Its sensor and actuator are concepts. The fitted boom failed the simulated get-up trials. Center the head before withdrawing the cartridge.",
    "links": [
      [
        "Geometry and recovery trials",
        "folding-shoulder-results.json"
      ]
    ]
  },
  {
    "id": "stack",
    "label": "Stackable deck",
    "image": "stack-deck.png",
    "alt": "Backpack deck with one and two cartridges installed, shown next to the loose retention pins",
    "note": "The upper deck shares the yoke's two M3 axes. Slide a cartridge forward onto its stop and insert the lateral pin. The second cartridge adds 6.2 mm of stack height. CAD checked both seated cartridges, their insertion paths and pin engagement. Payload mass and roll clearance need a new test for each build.",
    "links": [
      [
        "Deck, cartridges and fit data",
        "stack-deck-fit.zip"
      ]
    ]
  },
  {
    "id": "teeth",
    "label": "Side-only teeth",
    "image": "screw-teeth.png",
    "alt": "Four independent rows attached to upper and lower jaws, with recessed screws and nut section",
    "note": "Remove a four-tooth strip and only two 2.30 mm holes remain on that cheek. All nuts lie inside the original V5 profile. The 0–30° jaw sweep cleared the opposing rigid jaw by at least 0.80 mm. Check the upper strip for rocking on the first print.",
    "links": [
      [
        "Print files, assembly and fit data",
        "screw-cheek-teeth.zip"
      ]
    ]
  },
  {
    "id": "face",
    "label": "Mask and beard",
    "image": "magnetic-face.png",
    "alt": "Bare V5 head and chin beside the same parts with the magnetic mask and beard fitted",
    "note": "The parts carry the magnets. Steel targets can be fitted later through the inside of the face and under the lower mouth pad. Both outside surfaces stay intact. Measure peel and slip on the included coupons before wearing the accessories.",
    "links": [
      [
        "Magnetic print kit and assembly guides",
        "magnetic-face-kit.zip"
      ],
      [
        "Chin hatch",
        "beard-hatch.png"
      ],
      [
        "Mask section",
        "mask-magnetic-section.png"
      ],
      [
        "Earlier screw-on version",
        "mask-beard-fit.zip"
      ]
    ]
  }
];
  const url = new URL(location.href);
  const drawing = document.getElementById('drawing');
  const choices = document.getElementById('choices');
  const links = document.getElementById('links');
  const buttons = new Map();
  function select(study, updateAddress) {
    const replay = document.getElementById('replay');
    const options = study.replays || [];
    document.getElementById('replay-controls').hidden = options.length === 0;
    const pick = options.find(option => option.id === url.searchParams.get('replay')) || options[0];
    replay.replaceChildren(...options.map(option => new Option(option.label, option.id, false, option === pick)));
    replay.onchange = () => {
      url.searchParams.set('replay', replay.value);
      select(study, true);
    };
    drawing.src = 'sim/' + (pick?.image || study.image);
    drawing.alt = pick ? study.label + ' · ' + pick.label : study.alt;
    document.getElementById('notes').textContent = pick?.note || study.note;
    for (const [id, button] of buttons) button.setAttribute('aria-pressed', String(id === study.id));
    links.replaceChildren(...(study.links || []).map(([label, file]) => {
      const link = document.createElement('a');
      link.textContent = label;
      link.href = 'sim/' + file;
      return link;
    }));
    if (updateAddress) {
      url.searchParams.set('view', study.id);
      if (!options.length) url.searchParams.delete('replay');
      history.replaceState(null, '', url);
    }
  }
  for (const study of studies) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = study.label;
    button.addEventListener('click', () => select(study, true));
    buttons.set(study.id, button);
    choices.append(button);
  }
  select(studies.find(study => study.id === url.searchParams.get('view')) || studies[0], false);
</script>
</body></html>
