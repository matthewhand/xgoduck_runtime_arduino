<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera replay · Duck Lab</title>
  <link rel="stylesheet" href="sim/sim.css?v=15">
  <link rel="stylesheet" href="sim/camera-replay.css?v=1">
</head>
<body>
<main class="camera-lab">
  <header class="topbar">
    <h1>Camera replay</h1>
    <nav aria-label="Duck Lab"><a href="simulate.html">Duck Lab</a><a href="dock-vision.html">Synthetic dock vision</a></nav>
  </header>
  <div class="camera-grid">
    <section aria-label="Footage and transport">
      <div class="camera-source">
        <button id="connect">Connect Grove</button>
        <button id="record" disabled>Record up to 20 s</button>
        <button id="open">Open footage</button>
        <input id="file" type="file" accept=".json,image/jpeg,image/png,video/*" multiple hidden>
        <button id="example">Load synthetic example</button>
        <button id="save" disabled>Save recording</button>
      </div>
      <p id="camera-status" role="status">Open a recording, video, or stills to compare the detectors.</p>
      <div id="frame-holder" hidden>
        <canvas id="frame" aria-label="Selected camera frame with detector and annotation boxes"></canvas>
      </div>
      <div class="camera-transport" id="transport" hidden>
        <button id="previous" aria-label="Previous frame">‹</button>
        <button id="play">Play</button>
        <button id="next" aria-label="Next frame">›</button>
        <input id="seek" aria-label="Replay frame" type="range" min="0" max="0" value="0">
        <output id="time" for="seek"></output>
      </div>
    </section>
    <section class="camera-results" aria-label="Detector comparison">
      <h2>Frame comparison</h2>
      <dl class="frame-results">
        <div><dt class="mlp">MLP + printed ID</dt><dd id="mlp-frame">—</dd></div>
        <div><dt class="cad">CAD marker fit</dt><dd id="cad-frame">—</dd></div>
      </dl>
      <div class="camera-annotations">
        <label>Ground truth
          <select id="truth" disabled>
            <option value="unknown">Unlabelled</option>
            <option value="present">Dock visible</option>
            <option value="absent">Dock absent</option>
          </select>
        </label>
        <button id="box" disabled aria-pressed="false">Draw dock box</button>
        <button id="clear-box" disabled>Clear box</button>
      </div>
      <p id="frame-caption">Label a frame to score it. Draw a box to check where the detector thinks the dock is.</p>
      <div class="camera-annotations">
        <label>Review
          <select id="filter" disabled>
            <option value="all">All frames</option>
            <option value="difference">Detector disagreements</option>
            <option value="miss">Misses and wrong boxes</option>
            <option value="false alarm">False alarms</option>
            <option value="unlabelled">Unlabelled frames</option>
          </select>
        </label>
        <button id="export" disabled>Save results CSV</button>
      </div>
      <p id="review-status" role="status">—</p>
      <table aria-label="Results on labelled frames">
        <thead><tr><th scope="col">Labelled frames</th><th scope="col">MLP + ID</th><th scope="col">CAD fit</th></tr></thead>
        <tbody id="totals"></tbody>
      </table>
    </section>
  </div>
</main>
<script type="module" src="sim/camera-replay.mjs?v=1"></script>
</body>
</html>
